name: 打包 HAP

# 为什么用 self-hosted runner：
# 鸿蒙工程要用 DevEco 自带的 SDK 与 hvigor，而本工程还用到 HMS 套件
# （`@kit.LiveViewKit` 等，只有 DevEco 的 SDK 里有）；官方命令行工具需要华为账号接受许可。
# GitHub 托管 runner 上装不出这套环境，所以出包交给"装了 DevEco 的那台机器"上的 runner。
#
# 触发方式刻意只留手工：托管 runner 离线时 push 触发只会让任务一直排队，没有意义。
on:
  workflow_dispatch:
    inputs:
      signed:
        description: '打签名包（需仓库变量 SIGNING_DIR 指向 dev-material/signing）'
        type: boolean
        default: true

jobs:
  build:
    runs-on: [self-hosted, macOS]
    defaults:
      run:
        working-directory: harmony
    steps:
      - uses: actions/checkout@v4

      # CI 的工作区是全新 clone，没有私有的 dev-material；
      # build-profile.local.json5 里对证书/密钥用的是相对路径（../dev-material/signing/...），
      # 所以这里把 SIGNING_DIR 软链到同一个位置，再覆盖 build-profile（与本地 apply 脚本等效）。
      - name: 注入本机签名
        if: ${{ inputs.signed }}
        env:
          SIGNING_DIR: ${{ vars.SIGNING_DIR }}
        run: |
          if [ -z "${SIGNING_DIR}" ]; then
            echo "::error::未配置仓库变量 SIGNING_DIR（应指向 dev-material/signing）"
            exit 1
          fi
          if [ ! -f "${SIGNING_DIR}/build-profile.local.json5" ]; then
            echo "::error::${SIGNING_DIR} 下找不到 build-profile.local.json5"
            exit 1
          fi
          mkdir -p ../dev-material
          ln -sfn "${SIGNING_DIR}" ../dev-material/signing
          cp "${SIGNING_DIR}/build-profile.local.json5" build-profile.json5
          git update-index --skip-worktree -- build-profile.json5
          echo "签名已注入（对应配置见 SIGNING_DIR）"

      - name: 全量自检
        run: ./scripts/check.sh

      - name: 打包（release 产品）
        run: |
          ./hvigor.sh assembleHap --mode module \
            -p module=entry@default \
            -p product=release \
            -p buildMode=release
          ls -la entry/build/release/outputs/default/*.hap

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: hap-${{ github.run_number }}
          # 注意：artifact 的 path 相对仓库根目录，不是上面步骤的 working-directory
          path: harmony/entry/build/release/outputs/default/*.hap
          if-no-files-found: error
          retention-days: 14
