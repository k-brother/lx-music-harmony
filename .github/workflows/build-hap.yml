name: 打包 HAP

# 为什么必须是 self-hosted runner：
# 鸿蒙出包要用 DevEco Studio 自带的 SDK 与 hvigor，本工程还用到只有 DevEco SDK 里带的
# HMS 套件（`@kit.LiveViewKit` 等）；华为官方命令行工具需要华为账号交互式接受许可。
# GitHub 只是代码托管，托管 runner 上没有（也无法非交互地装上）这套环境，
# 所以出包交给"装了 DevEco 的那台 Mac"上的 runner 跑。
#
# 触发方式（公开仓库上的 self-hosted runner 不接 PR / fork，所以只挂这两种）：
#   1) 打标签：push 一个 `v*` 标签 → 自动出包 + 发布到同名 Release（推荐，见 scripts/release_tag.sh）
#   2) 手工：Actions → 打包 HAP → Run workflow（可只出 artifact，也可指定 release_tag 发 Release）
#
# 说明：`workflow_dispatch` 要求工作流定义出现在默认分支，所以默认分支上也有一份同样的
# 工作流文件；改这里的时候记得把默认分支那份同步过去。
on:
  workflow_dispatch:
    inputs:
      signed:
        description: '打签名包（需仓库变量 SIGNING_DIR 指向 dev-material/signing）'
        type: boolean
        default: true
      release_tag:
        description: '（可选）发布到 Release，填版本号如 v1.0.0；留空只上传 artifact'
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      # 标签推送 = 发布版本（默认签名）；手工触发 = 用输入决定
      - name: 解析构建参数
        id: params
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            SIGNED=true
          else
            TAG="${{ inputs.release_tag }}"
            SIGNED="${{ inputs.signed }}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "signed=${SIGNED}" >> "${GITHUB_OUTPUT}"
          echo "触发=${GITHUB_EVENT_NAME} 发布标签=[${TAG}] 签名=[${SIGNED}]"

      # CI 的工作区是全新 clone，没有私有的 dev-material；
      # build-profile.local.json5 里对证书/密钥用的是相对路径（../dev-material/signing/...），
      # 所以这里把 SIGNING_DIR 软链到同一个位置，再覆盖 build-profile（与本地 apply 脚本等效）。
      - name: 注入本机签名
        if: steps.params.outputs.signed == 'true'
        env:
          SIGNING_DIR: ${{ vars.SIGNING_DIR }}
        run: |
          if [ -z "${SIGNING_DIR}" ]; then
            echo "::error::未配置仓库变量 SIGNING_DIR（应指向 dev-material/signing）"
            exit 1
          fi
          if [ ! -f "${SIGNING_DIR}/build-profile.local.json5" ]; then
            echo "::error::${SIGNING_DIR} 下找不到 build-profile.local.json5"
            exit 1
          fi
          mkdir -p ../dev-material
          ln -sfn "${SIGNING_DIR}" ../dev-material/signing
          cp "${SIGNING_DIR}/build-profile.local.json5" build-profile.json5
          git update-index --skip-worktree -- build-profile.json5
          echo "签名已注入（对应配置见 SIGNING_DIR）"

      - name: 全量自检
        run: ./scripts/check.sh

      - name: 打包（release 产品）
        run: |
          ./hvigor.sh assembleHap --mode module \
            -p module=entry@default \
            -p product=release \
            -p buildMode=release
          ls -la entry/build/release/outputs/default/*.hap

      # 附件名要能一眼看出「哪个版本、签没签名」，所以重命名后再分发：
      #   lx-music-harmony-v1.0.0-signed.hap / -unsigned.hap
      - name: 整理发布产物
        run: |
          set -euo pipefail
          tag="${{ steps.params.outputs.tag }}"
          [ -n "${tag}" ] || tag="run${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          for hap in entry/build/release/outputs/default/*.hap; do
            base="$(basename "${hap}" .hap)"
            case "${base}" in
              *-signed) kind=signed ;;
              *-unsigned) kind=unsigned ;;
              *) kind=other ;;
            esac
            cp "${hap}" "dist/lx-music-harmony-${tag}-${kind}.hap"
          done
          ls -la dist/

      - name: 上传产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: hap-${{ github.run_number }}
          path: dist/*.hap
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 Release
        if: steps.params.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_release.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${{ steps.params.outputs.tag }}" \
            --notes-file .github/RELEASE_NOTES.md \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            dist/*.hap
