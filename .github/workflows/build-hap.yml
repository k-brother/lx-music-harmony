name: 打包 HAP

# 为什么用 self-hosted runner：
# 鸿蒙出包要用 DevEco Studio 自带的 SDK 与 hvigor，本工程还用到只随 DevEco SDK 分发的
# HMS 套件（`@kit.LiveViewKit` 等）；官方命令行工具需要华为账号交互式接受许可。
# 这类环境装不到 GitHub 托管的 runner 上，所以出包交给一台装了 DevEco 的自托管机器。
#
# 触发方式（自托管 runner 不接 PR / fork，所以只挂这两种）：
#   1) 打标签：push 一个 `v*` 标签 → 出包 + 发布到同名 Release（见 scripts/release_tag.sh）
#   2) 手工：Actions → 打包 HAP → Run workflow（只出 artifact，或指定 release_tag 发 Release）
#
# 说明：`workflow_dispatch` 要求工作流定义出现在默认分支上，请保持默认分支的副本同步。
on:
  workflow_dispatch:
    inputs:
      signed:
        description: '打签名包（需仓库变量 SIGNING_DIR 指向 dev-material/signing）'
        type: boolean
        default: true
      release_tag:
        description: '（可选）发布到 Release，填版本号如 v1.0.0；留空只上传 artifact'
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      # 标签推送 = 发布版本（默认签名）；手工触发 = 用输入决定
      - name: 解析构建参数
        id: params
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            SIGNED=true
          else
            TAG="${{ inputs.release_tag }}"
            SIGNED="${{ inputs.signed }}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "signed=${SIGNED}" >> "${GITHUB_OUTPUT}"
          echo "触发=${GITHUB_EVENT_NAME} 发布标签=[${TAG}] 签名=[${SIGNED}]"

      # 仓库里的 build-profile.json5 是脱敏版；这里把签名机上那份真实配置注入进来，
      # 相对路径统一解析到 SIGNING_DIR 下（见 scripts/inject_signing.py），
      # 因此工作流不需要假设机器上有任何特定目录结构。
      - name: 注入本机签名
        if: steps.params.outputs.signed == 'true'
        env:
          SIGNING_DIR: ${{ vars.SIGNING_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_DIR}" ]; then
            echo "::error::未配置仓库变量 SIGNING_DIR（指向签名材料目录）"
            exit 1
          fi
          if [ ! -f "${SIGNING_DIR}/build-profile.local.json5" ]; then
            echo "::error::${SIGNING_DIR} 下找不到 build-profile.local.json5"
            exit 1
          fi
          python3 scripts/inject_signing.py --signing-dir "${SIGNING_DIR}" > build-profile.json5
          git update-index --skip-worktree -- build-profile.json5
          echo "签名配置已注入（证书/口令来自 SIGNING_DIR，未写进仓库）"

      - name: 全量自检
        run: ./scripts/check.sh

      - name: 打包（release 产品）
        run: |
          ./hvigor.sh assembleHap --mode module \
            -p module=entry@default \
            -p product=release \
            -p buildMode=release
          ls -la entry/build/release/outputs/default/*.hap

      # 附件名要能一眼看出「哪个版本、签没签名」，所以重命名后再分发：
      #   lx-music-harmony-v1.0.0-signed.hap / -unsigned.hap
      - name: 整理发布产物
        run: |
          set -euo pipefail
          tag="${{ steps.params.outputs.tag }}"
          [ -n "${tag}" ] || tag="run${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          for hap in entry/build/release/outputs/default/*.hap; do
            base="$(basename "${hap}" .hap)"
            case "${base}" in
              *-signed) kind=signed ;;
              *-unsigned) kind=unsigned ;;
              *) kind=other ;;
            esac
            cp "${hap}" "dist/lx-music-harmony-${tag}-${kind}.hap"
          done
          ls -la dist/

      - name: 上传产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: hap-${{ github.run_number }}
          path: dist/*.hap
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 Release
        if: steps.params.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_release.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${{ steps.params.outputs.tag }}" \
            --notes-file .github/RELEASE_NOTES.md \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            dist/*.hap

      # Gitee 只做"镜像一份发行版 + 附件"（其托管构建同样没有鸿蒙 SDK）。
      # 没配令牌就跳过，不影响发布。
      - name: 同步到 Gitee 发行版
        if: steps.params.outputs.tag != '' && vars.GITEE_REPO != ''
        env:
          GITEE_TOKEN_FILE: ${{ vars.GITEE_TOKEN_FILE }}
        run: |
          if [ -z "${GITEE_TOKEN_FILE}" ] || [ ! -f "${GITEE_TOKEN_FILE}" ]; then
            echo "跳过 Gitee：未配置仓库变量 GITEE_TOKEN_FILE（Gitee 私人令牌文件路径）"
            exit 0
          fi
          python3 scripts/publish_gitee_release.py \
            --repo "${{ vars.GITEE_REPO }}" \
            --tag "${{ steps.params.outputs.tag }}" \
            --target "${GITHUB_SHA}" \
            --token-file "${GITEE_TOKEN_FILE}" \
            --notes-file .github/RELEASE_NOTES.md \
            dist/*.hap
